<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Formulario de estado climatico</title>

  <!-- Enlace a la hoja de estilos de Bootstrap desde un CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* Estilos generales para el cuerpo de la página */
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #d3cce3, #e9e4f0); /* Fondo degradado */
      min-height: 100vh;
      display: flex;
      align-items: center; /* Centra el contenido verticalmente */
      justify-content: center; /* Centra el contenido horizontalmente */
    }

    /* Estilos para el contenedor del formulario */
    .traffic-form-container {
      background: #fff; /* Fondo blanco */
      padding: 30px;
      border-radius: 16px; /* Bordes redondeados */
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1); /* Sombra sutil */
      width: 100%;
      max-width: 500px; /* Ancho máximo del contenedor */
    }

    /* Estilos para la tarjeta de resultados */
    .result-card {
      background: #f8f8ff; /* Fondo gris claro */
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1); /* Sombra sutil */
    }

    /* Estilos para los mensajes de error */
    .error {
      color: red;
      font-weight: bold;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <!-- Contenedor principal de la página -->
  <div class="container">
    <!-- Contenedor del formulario -->
    <div class="traffic-form-container">
      <h2 class="text-center">🚦 Reporte de clima</h2>
      <form id="traffic-form">
        <!-- Campo de entrada para la ubicación -->
        <div class="mb-3">
          <label for="location" class="form-label">📍 Ubicación:</label>
          <input type="text" id="location" name="location" class="form-control" placeholder="Ingresa la ubicación" required />
        </div>
        <!-- Campo de selección para el nivel de tráfico -->
        <div class="mb-3">
          <label for="traffic-level" class="form-label">📊 Nivel de clima:</label>
          <select id="traffic-level" name="traffic-level" class="form-select" required>
            <option value="bajo">Bajo</option>
            <option value="moderado">Moderado</option>
            <option value="alto">Alto</option>
          </select>
        </div>
        <!-- Campo de entrada para la hora del reporte -->
        <div class="mb-3">
          <label for="time" class="form-label">⏰ Hora del Reporte:</label>
          <input type="time" id="time" name="time" class="form-control" required />
        </div>
        <!-- Botón de envío del formulario -->
        <input type="submit" value="Enviar Reporte" class="btn btn-primary w-100" />
      </form>
      <!-- Contenedor donde se mostrarán los resultados -->
      <div id="result"></div>
    </div>
  </div>

  <!-- Inclusión de JavaScript de Bootstrap desde un CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Script personalizado para manejar la lógica del formulario -->
  <script>
    // Escucha el evento de envío del formulario
    document.getElementById('traffic-form').addEventListener('submit', async function(event) {
      event.preventDefault(); // Previene el envío normal del formulario

      // Obtención de los valores ingresados en el formulario
      const rawLocation = document.getElementById('location').value.trim();
      const trafficLevel = document.getElementById('traffic-level').value;
      const time = document.getElementById('time').value;

      // Función para normalizar el texto (eliminar acentos y caracteres especiales)
      function normalizeText(text) {
        return text.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      }

      // Normalización de la ubicación ingresada
      const location = normalizeText(rawLocation);

      // Verifica si la ubicación está vacía y muestra un mensaje de error
      if (!location) {
        document.getElementById('result').innerHTML = `<p class="error">⚠️ Ingresa una ubicación válida.</p>`;
        return;
      }

      // Definición de la clave API y URL de la API de OpenWeatherMap para obtener el clima
      const apiKey = '7f45c89dcb6856b402e11571e6356de9'; // <-- Tu API Key
      const apiUrl = `https://api.openweathermap.org/data/2.5/weather?q=${location}&appid=${apiKey}&units=metric&lang=es`;

      try {
        // Realiza la solicitud a la API
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error('No se pudo obtener el clima. Verifica la ciudad.');

        // Parseo de los datos recibidos en formato JSON
        const data = await response.json();

        // Construcción del HTML para mostrar los resultados
        const resultHTML = `
          <div class="result-card mt-4">
            <h4>🌤 Clima en ${data.name}</h4>
            <p><strong>Temperatura:</strong> ${data.main.temp} °C</p>
            <p><strong>Condición:</strong> ${data.weather[0].description}</p>
            <p><strong>Humedad:</strong> ${data.main.humidity}%</p>
            <p><strong>Viento:</strong> ${data.wind.speed} m/s</p>
            <hr>
            <p><strong>Nivel de tráfico ingresado:</strong> ${trafficLevel}</p>
            <p><strong>Hora del reporte:</strong> ${time}</p>
          </div>
        `;

        // Muestra los resultados en la página
        document.getElementById('result').innerHTML = resultHTML;
      } catch (error) {
        // En caso de error, muestra el mensaje de error en la página
        document.getElementById('result').innerHTML = `<p class="error">⚠️ ${error.message}</p>`;
      }
    });
  </script>
</body>
</html>
