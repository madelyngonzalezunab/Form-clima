<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login IA | OpenRouter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: white;
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background-color: rgba(0, 0, 0, 0.8);
      padding: 2rem;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,255,255,0.2);
    }
    .form-label {
      color: #0ff;
    }
    .btn-primary {
      background-color: #0ff;
      color: #000;
      border: none;
    }
    .btn-primary:hover {
      background-color: #00e6e6;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="login-card text-center">
        <h2 class="mb-4">Inicio de Sesión IA</h2>
        <form id="loginForm">
          <div class="mb-3 text-start">
            <label for="email" class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" id="email" placeholder="tu@email.com" required>
          </div>
          <div class="mb-3 text-start">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="password" placeholder="" required>
          </div>
          <div class="mb-3 text-start">
            <label for="apiKey" class="form-label">API Key (OpenRouter)</label>
            <input type="text" class="form-control" id="apiKey" placeholder="sk-xxxxxxxx" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Acceder</button>
        </form>
        <div id="responseMessage" class="mt-3"></div>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const apiKey = document.getElementById("apikey").value;
      const errorDiv = document.getElementById("error");

      if (email === "admin@gmail.com" && password === "admin123" && apiKey) {
        localStorage.setItem("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", apiKey);
        window.location.href = "chatbot.html";
      } else {
        errorDiv.innerText = "Credenciales incorrectas o falta la API Key.";
      }
    }
  </script>
</body>
</html>
