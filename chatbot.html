<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Chat IA - OpenRouter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #1e1e2f;
      color: white;
      padding: 2rem;
    }
    .chat-box {
      max-width: 700px;
      margin: auto;
      background: #2c2f3e;
      border-radius: 10px;
      padding: 1rem;
      height: 500px;
      overflow-y: auto;
    }
    .user-msg {
      color: #0ff;
      margin-bottom: 0.5rem;
    }
    .ai-msg {
      color: #ccc;
      margin-left: 1rem;
      margin-bottom: 0.5rem;
    }
    input, button {
      margin-top: 1rem;
    }
  </style>
</head>
<body>

<div class="chat-box" id="chatBox">
  <div><strong class="ai-msg">🤖 IA:</strong> Hola, ¿en qué puedo ayudarte hoy?</div>
</div>

<div class="container mt-3">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <input type="text" id="apiKey" class="form-control mb-2" placeholder="Introduce tu API Key de OpenRouter">
      <input type="text" id="userInput" class="form-control" placeholder="Escribe tu mensaje...">
      <button class="btn btn-info mt-2 w-100" onclick="sendMessage()">Enviar</button>
    </div>
  </div>
</div>

<script>
  const model = "mistralai/mistral-7b-instruct";

  async function sendMessage() {
    const userInputElement = document.getElementById("userInput");
    const apiKeyElement = document.getElementById("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");
    const userInput = userInputElement.value.trim();
    const apiKey = apiKeyElement.value.trim();

    if (!userInput || !apiKey) return alert("Completa el mensaje y la API Key.");

    const chatBox = document.getElementById("chatBox");
    chatBox.innerHTML += <div><strong class="user-msg">👤 Tú:</strong> ${userInput}</div>;
    userInputElement.value = "";

    try {
      const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
        method: "POST",
        headers: {
          "Authorization": Bearer ${apiKey},
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          model: model,
          messages: [
            { role: "system", content: "Eres un asistente de inteligencia artificial útil." },
            { role: "user", content: userInput }
          ]
        })
      });

      const data = await response.json();
      console.log("Respuesta de API:", data);

      let reply = "Error en la respuesta.";
      if (data.choices && data.choices.length > 0) {
        reply = data.choices[0].message.content;
      }

      chatBox.innerHTML += <div><strong class="ai-msg">🤖 IA:</strong> ${reply}</div>;
      chatBox.scrollTop = chatBox.scrollHeight;
    } catch (error) {
      console.error("Error al llamar a la API:", error);
      chatBox.innerHTML += <div class="text-danger">❌ No se pudo contactar con OpenRouter.</div>;
    }
  }
</script>

</body>
</html>
